
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form đăng ký người dùng</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
            padding: 25px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 10px #cccccc;
        }

        h2 {
            text-align: center;
            color: #333333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }

        .gender {
            margin-top: 8px;
        }

        .gender label {
            display: inline-block;
            margin-right: 15px;
        }

        button {
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            background-color: #2878d0;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #185da8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Đăng ký người dùng</h2>

        <form action="http://demo.codegym.vn/6/registration_form/register.php"
              method="POST">

            <label for="name">Họ và tên:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Số điện thoại:</label>
            <input type="tel" id="phone" name="phone" required>

            <label>Giới tính:</label>
            <div class="gender">
                <label>
                    <input type="radio" name="gender" value="Nam" required>
                    Nam
                </label>

                <label>
                    <input type="radio" name="gender" value="Nữ">
                    Nữ
                </label>

                <label>
                    <input type="radio" name="gender" value="Khác">
                    Khác
                </label>
            </div>

            <button type="submit">Đăng ký</button>
            <button type="reset">Nhập lại</button>
        </form>
    </div>
</body>
</html>
